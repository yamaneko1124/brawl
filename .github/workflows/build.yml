name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dylib:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Write Makefile
        run: |
          printf 'export TARGET = iphone:clang:latest:15.0\n' > Makefile
          printf 'export ARCHS = arm64 arm64e\n' >> Makefile
          printf 'export DEBUG = 0\n' >> Makefile
          printf 'include $(THEOS)/makefiles/common.mk\n' >> Makefile
          printf 'LIBRARY_NAME = BrawlCheat\n' >> Makefile
          printf 'BrawlCheat_FILES = Tweak.mm\n' >> Makefile
          printf 'BrawlCheat_FRAMEWORKS = UIKit Foundation CoreGraphics QuartzCore IOKit\n' >> Makefile
          printf 'BrawlCheat_CFLAGS = -fobjc-arc -std=c++17 -Wno-deprecated-declarations\n' >> Makefile
          printf 'BrawlCheat_LDFLAGS = -Wl,-not_for_dyld_shared_cache\n' >> Makefile
          printf 'include $(THEOS_MAKE_PATH)/library.mk\n' >> Makefile

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: ldid
        run: brew install ldid

      - name: Build
        run: |
          make clean
          make -j4

      - name: Sign and collect
        run: |
          mkdir -p dist
          D=$(find .theos/obj -name 'BrawlCheat.dylib' -not -path '*arm64*' | head -1)
          [ -z "$D" ] && D=$(find .theos/obj -name 'BrawlCheat.dylib' | head -1)
          [ -z "$D" ] && { echo "no dylib produced"; exit 1; }
          cp "$D" dist/BrawlCheat.dylib
          ldid -S dist/BrawlCheat.dylib
          file dist/BrawlCheat.dylib
          shasum -a 256 dist/BrawlCheat.dylib > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: BrawlCheat-dylib
          path: dist/
          retention-days: 30
